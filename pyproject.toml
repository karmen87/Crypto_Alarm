[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-alarm"
description = "Binance price monitoring with target, extreme and timeframe alarms"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "Flask>=3.0,<4",
    "flask-socketio>=5.3,<6",
    "simple-websocket>=1.0",
    "requests>=2.31",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
server = ["gunicorn>=22"]
dev = ["ruff>=0.6", "mypy>=1.11", "types-requests", "pytest>=8"]

[project.scripts]
crypto-alarm = "crypto_alarm.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "crypto_alarm.__version__" }

[tool.setuptools.packages.find]
include = ["crypto_alarm*"]

[tool.setuptools.package-data]
crypto_alarm = ["templates/*.html", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs"]  # Hugo site: its Markdown holds illustrative snippets, not project code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"crypto_analysis.py" = ["E501"]  # long lines live in the embedded HTML/JS template

[tool.mypy]
python_version = "3.10"
strict = true
files = ["crypto_alarm"]

[[tool.mypy.overrides]]
module = ["flask_socketio", "websocket"]
ignore_missing_imports = true
